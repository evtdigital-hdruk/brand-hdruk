name: Build smoke

# Verify the brand stylesheet build (Paragon CLI build-tokens + build-scss) still
# compiles and emits the theme CSS. Catches SCSS/token regressions that would
# otherwise only surface when an MFE rebuilds against this package.
on:
  push:
    branches:
      - "hdr-uk/**"
      - "upgrade/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check outputs
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # paragon/build and dist/ are committed. Remove them first so the
      # checks below prove this build emitted the files.
      - name: Remove committed build output
        run: rm -rf paragon/build dist

      - name: Build
        id: build
        run: npm run build

      - name: Token build emitted the core, light and dark stylesheets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          test -s paragon/build/core/index.css
          test -s paragon/build/themes/light/index.css
          test -s paragon/build/themes/dark/index.css

      - name: SCSS build emitted the core, light and dark bundles
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          test -s dist/core.css
          test -s dist/core.min.css
          test -s dist/light.css
          test -s dist/light.min.css
          test -s dist/dark.css
          test -s dist/dark.min.css
          test -s dist/theme-urls.json
